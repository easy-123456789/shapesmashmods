<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShapeSmash Mod Generator</title>
    <style>
      :root {
        --bg: #020817;
        --bg-2: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --border: #334155;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #a78bfa;
        --green: #34d399;
        --warn: #fbbf24;
        --danger: #f87171;
        --code: #0b1120;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin-bottom: 22px;
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(360px, 480px) minmax(420px, 1fr);
        gap: 22px;
      }

      .panel {
        border: 1px solid var(--border);
        background: rgba(17, 24, 39, 0.95);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      }

      .controls {
        padding: 18px;
      }

      .section {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 14px;
        background: rgba(15, 23, 42, 0.7);
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .section-title {
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 10px 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        color: var(--muted);
        font-size: 0.82rem;
      }

      input, select, textarea, button {
        border-radius: 10px;
        border: 1px solid var(--border);
        font: inherit;
      }

      input, select {
        background: var(--panel-2);
        color: var(--text);
        padding: 9px 10px;
      }

      input[type="color"] {
        min-height: 42px;
        padding: 4px;
        background: #0f172a;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
      }

      textarea {
        width: 100%;
        min-height: 520px;
        resize: vertical;
        background: var(--code);
        color: #dbeafe;
        border-color: var(--border);
        line-height: 1.45;
        padding: 16px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      button {
        cursor: pointer;
        padding: 10px 14px;
        font-weight: 700;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), #2563eb);
        border-color: transparent;
        color: white;
      }

      .secondary {
        background: var(--panel-2);
        color: var(--text);
      }

      .success {
        background: rgba(52, 211, 153, 0.12);
        color: #bbf7d0;
        border-color: rgba(52, 211, 153, 0.35);
      }

      .warning {
        background: rgba(251, 191, 36, 0.12);
        color: #fde68a;
        border-color: rgba(251, 191, 36, 0.35);
      }

      .preview {
        padding: 16px;
      }

      .preview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(52, 211, 153, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.4);
        color: #bbf7d0;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
        display: inline-block;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ShapeSmash Mod Generator</h1>
      <div class="subtitle">Customize a character mod, load a preset, and export it as a JavaScript file.</div>

      <div class="layout">
        <section class="panel controls">
          <div class="section">
            <div class="section-header">
              <div class="section-title">Presets</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="presetSelect">Choose a preset</label>
                <select id="presetSelect">
                  <option value="custom">Custom / blank</option>
                  <option value="brawler">Brawler</option>
                  <option value="speedster">Speedster</option>
                  <option value="glass">Glass Cannon</option>
                  <option value="tank">Tank</option>
                  <option value="ranger">Ranger</option>
                  <option value="acrobat">Acrobat</option>
                  <option value="mage">Mage</option>
                  <option value="support">Support</option>
                  <option value="shadow">Shadow Assassin</option>
                </select>
              </div>
              <div class="field full">
                <div class="button-row">
                  <button type="button" class="primary" id="loadPresetBtn">Load preset</button>
                  <button type="button" class="secondary" id="randomBtn">Randomize</button>
                </div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Basic stats</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="key">Key</label>
                <input id="key" value="custom-fighter" />
              </div>

              <div class="field full">
                <label for="name">Name</label>
                <input id="name" value="Custom Fighter" />
              </div>

              <div class="field full">
                <label for="color">Color</label>
                <input id="color" type="color" value="#38bdf8" />
              </div>

              <div class="field full">
                <label for="mySrc">Image URL (optional)</label>
                <input id="mySrc" placeholder="https://example.com/fighter.png" />
              </div>

              <div class="field full">
                <label for="spriteKey">Built-in sprite key (optional)</label>
                <input id="spriteKey" placeholder="p1Img" />
              </div>

              <div class="field full">
                <label for="description">Flavor text</label>
                <input id="description" value="A balanced fighter built for the arena." />
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Movement</div>
            </div>
            <div class="form-grid">
              <div class="field">
                <label for="speed">Speed</label>
                <input id="speed" type="number" step="0.1" value="1.3" />
              </div>

              <div class="field">
                <label for="jumpMultiplier">Jump Multiplier</label>
                <input id="jumpMultiplier" type="number" step="0.1" value="1.2" />
              </div>

              <div class="field">
                <label for="canGlide">Glide</label>
                <div class="checkbox-row">
                  <input id="canGlide" type="checkbox" checked />
                  <span>Enabled</span>
                </div>
              </div>

              <div class="field">
                <label for="glideGravityMultiplier">Glide Gravity</label>
                <input id="glideGravityMultiplier" type="number" step="0.01" value="0.08" />
              </div>

              <div class="field">
                <label for="glideFallSpeed">Glide Fall Speed</label>
                <input id="glideFallSpeed" type="number" step="0.1" value="2.3" />
              </div>

              <div class="field">
                <label for="sizeMultiplier">Size Multiplier</label>
                <input id="sizeMultiplier" type="number" step="0.1" value="1.0" />
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Combat</div>
            </div>
            <div class="form-grid">
              <div class="field">
                <label for="attackMultiplier">Attack Multiplier</label>
                <input id="attackMultiplier" type="number" step="0.1" value="1.5" />
              </div>

              <div class="field">
                <label for="fallDamageMultiplier">Fall Damage Multiplier</label>
                <input id="fallDamageMultiplier" type="number" step="0.1" value="1.0" />
              </div>

              <div class="field">
                <label for="passiveFallDamage">Passive Fall Damage</label>
                <div class="checkbox-row">
                  <input id="passiveFallDamage" type="checkbox" />
                  <span>Enabled</span>
                </div>
              </div>

              <div class="field">
                <label for="specialPower">Special Power</label>
                <input id="specialPower" type="number" step="1" value="18" />
              </div>

              <div class="field">
                <label for="specialCooldown">Special Cooldown</label>
                <input id="specialCooldown" type="number" step="1" value="45" />
              </div>

              <div class="field">
                <label for="specialType">Special Type</label>
                <select id="specialType">
                  <option value="special">special</option>
                  <option value="upSpecial">upSpecial</option>
                  <option value="downSpecial">downSpecial</option>
                  <option value="leftSpecial">leftSpecial</option>
                  <option value="rightSpecial">rightSpecial</option>
                </select>
              </div>

              <div class="field full">
                <label for="attackText">Attack callout</label>
                <input id="attackText" value="launches a quick combo swing!" />
              </div>

              <div class="field full">
                <label for="specialText">Special callout</label>
                <input id="specialText" value="dashes forward with a burst attack!" />
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Controls</div>
            </div>
            <div class="form-grid">
              <div class="field">
                <label for="leftKey">Left</label>
                <input id="leftKey" value="a" />
              </div>
              <div class="field">
                <label for="rightKey">Right</label>
                <input id="rightKey" value="d" />
              </div>
              <div class="field">
                <label for="jumpKey">Jump</label>
                <input id="jumpKey" value="w" />
              </div>
              <div class="field">
                <label for="attackKey">Attack</label>
                <input id="attackKey" value="f" />
              </div>
              <div class="field">
                <label for="finalKey">Final</label>
                <input id="finalKey" value="g" />
              </div>
              <div class="field">
                <label for="specialKey">Special</label>
                <input id="specialKey" value="s" />
              </div>
            </div>
          </div>

          <div class="button-row">
            <button type="button" class="primary" id="generateBtn">Generate Mod</button>
            <button type="button" class="secondary" id="copyBtn">Copy Code</button>
            <button type="button" class="success" id="downloadBtn">Download .js</button>
          </div>
        </section>

        <section class="panel preview">
          <div class="preview-header">
            <strong>Generated mod</strong>
            <span class="live-badge"><span class="dot"></span>Ready</span>
          </div>
          <textarea id="output" aria-label="Generated mod code"></textarea>
        </section>
      </div>
    </div>

      function setFieldValue(id, value) {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.type === 'checkbox') {
          el.checked = Boolean(value);
        } else {
          el.value = value ?? '';
        }
      }

      function applyPreset(name) {
        const preset = presets[name];
        if (!preset) return;

        Object.entries(preset).forEach(([key, value]) => {
          const fieldIds = {
            key: 'key',
            name: 'name',
            color: 'color',
            mySrc: 'mySrc',
            spriteKey: 'spriteKey',
            description: 'description',
            speed: 'speed',
            jumpMultiplier: 'jumpMultiplier',
            canGlide: 'canGlide',
            glideGravityMultiplier: 'glideGravityMultiplier',
            glideFallSpeed: 'glideFallSpeed',
            sizeMultiplier: 'sizeMultiplier',
            attackMultiplier: 'attackMultiplier',
            fallDamageMultiplier: 'fallDamageMultiplier',
            passiveFallDamage: 'passiveFallDamage',
            specialPower: 'specialPower',
            specialCooldown: 'specialCooldown',
            specialType: 'specialType',
            attackText: 'attackText',
            specialText: 'specialText',
            leftKey: 'leftKey',
            rightKey: 'rightKey',
            jumpKey: 'jumpKey',
            attackKey: 'attackKey',
            finalKey: 'finalKey',
            specialKey: 'specialKey'
          };

          const id = fieldIds[key];
          if (id) setFieldValue(id, value);
        });

        updateOutput();
      }

      function getValue(id, fallback = '') {
        const el = document.getElementById(id);
        if (!el) return fallback;
        if (el.type === 'checkbox') return el.checked;
        return el.value ?? fallback;
      }

      function escapeString(value) {
        return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      }

      function getSpecialMethodName() {
        const type = getValue('specialType', 'special');
        return type === 'special' ? 'special' : type;
      }

      function buildModText() {
        const key = getValue('key', 'custom-fighter').trim() || 'custom-fighter';
        const name = getValue('name', 'Custom Fighter').trim() || 'Custom Fighter';
        const color = getValue('color', '#38bdf8');
        const mySrc = getValue('mySrc', '').trim();
        const spriteKey = getValue('spriteKey', '').trim();
        const description = getValue('description', 'Custom fighter').trim() || 'Custom fighter';
        const speed = Number(getValue('speed', 1.3));
        const jumpMultiplier = Number(getValue('jumpMultiplier', 1.2));
        const canGlide = Boolean(getValue('canGlide', true));
        const glideGravityMultiplier = Number(getValue('glideGravityMultiplier', 0.08));
        const glideFallSpeed = Number(getValue('glideFallSpeed', 2.3));
        const sizeMultiplier = Number(getValue('sizeMultiplier', 1));
        const attackMultiplier = Number(getValue('attackMultiplier', 1.5));
        const fallDamageMultiplier = Number(getValue('fallDamageMultiplier', 1));
        const passiveFallDamage = Boolean(getValue('passiveFallDamage', false));
        const specialPower = Number(getValue('specialPower', 18));
        const specialCooldown = Number(getValue('specialCooldown', 45));
        const specialType = getValue('specialType', 'special');
        const attackText = escapeString(getValue('attackText', 'launches a quick combo swing!'));
        const specialText = escapeString(getValue('specialText', 'dashes forward with a burst attack!'));

        const keys = {
          left: escapeString(getValue('leftKey', 'a')),
          right: escapeString(getValue('rightKey', 'd')),
          jump: escapeString(getValue('jumpKey', 'w')),
          attack: escapeString(getValue('attackKey', 'f')),
          final: escapeString(getValue('finalKey', 'g')),
          special: escapeString(getValue('specialKey', 's'))
        };

        const mySrcLine = mySrc ? `  mySrc: '${escapeString(mySrc)}',\n` : '';
        const spriteKeyLine = spriteKey ? `  spriteKey: '${escapeString(spriteKey)}',\n` : '';
        const specialMethod = specialType === 'special' ? 'special' : specialType;

        return `Mods.registerCharacter({\n  key: '${escapeString(key)}',\n  name: '${escapeString(name)}',\n  color: '${escapeString(color)}',\n${mySrcLine}${spriteKeyLine}  description: '${escapeString(description)}',\n  speed: ${speed},\n  jumpMultiplier: ${jumpMultiplier},\n  canGlide: ${canGlide},\n  glideGravityMultiplier: ${glideGravityMultiplier},\n  glideFallSpeed: ${glideFallSpeed},\n  sizeMultiplier: ${sizeMultiplier},\n  attackMultiplier: ${attackMultiplier},\n  passiveFallDamage: ${passiveFallDamage},\n  fallDamageMultiplier: ${fallDamageMultiplier},\n\n  keys: {\n    left: '${keys.left}',\n    right: '${keys.right}',\n    jump: '${keys.jump}',\n    attack: '${keys.attack}',\n    final: '${keys.final}',\n    special: '${keys.special}'\n  },\n\n  attack(fighter, opponent) {\n    if (fighter.stocks <= 0 || fighter.attackCooldown > 0 || fighter.stunned > 0) return;\n\n    fighter.attackCooldown = 25;\n    fighter.punchFrame = 0;\n    fighter.punchAnimating = true;\n    addCommentary(fighter.name + ' ${attackText}');\n  },\n\n  ${specialMethod}(fighter, opponent) {\n    if (fighter.specialCooldown > 0 || fighter.stunned > 0) return;\n\n    const target = fighter.getOpponent();\n    fighter.vx += fighter.facing * ${specialPower};\n    fighter.specialCooldown = ${specialCooldown};\n    addCommentary(fighter.name + ' ${specialText}');\n\n    if (target) {\n      target.vx += fighter.facing * 3;\n    }\n  }\n});`;
      }

      function updateOutput() {
        const output = document.getElementById('output');
        output.value = buildModText();
      }

      function randomColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue} 85% 60%)`;
      }

      function randomizeForm() {
        const presetNames = Object.keys(presets).filter(name => name !== 'custom');
        const chosen = presetNames[Math.floor(Math.random() * presetNames.length)];
        applyPreset(chosen);
        document.getElementById('presetSelect').value = chosen;
      }

      function copyCode() {
        const output = document.getElementById('output');
        output.select();
        navigator.clipboard.writeText(output.value).then(() => {
          const button = document.getElementById('copyBtn');
          const prev = button.textContent;
          button.textContent = 'Copied!';
          setTimeout(() => { button.textContent = prev; }, 1000);
        }).catch(() => {
          alert('Copy failed. You can still select the code manually.');
        });
      }

      function downloadFile() {
        const text = document.getElementById('output').value;
        const filename = `${document.getElementById('key').value.trim() || 'custom-fighter'}.js`;
        const blob = new Blob([text + '\n'], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      document.getElementById('generateBtn').addEventListener('click', updateOutput);
      document.getElementById('copyBtn').addEventListener('click', copyCode);
      document.getElementById('downloadBtn').addEventListener('click', downloadFile);
      document.getElementById('loadPresetBtn').addEventListener('click', () => {
        const selected = document.getElementById('presetSelect').value;
        applyPreset(selected);
      });
      document.getElementById('randomBtn').addEventListener('click', randomizeForm);

      Object.keys(presets).forEach((name) => {
        if (name === 'custom') {
          document.getElementById('presetSelect').value = name;
        }
      });

      document.querySelectorAll('input, select').forEach((element) => {
        element.addEventListener('input', updateOutput);
        element.addEventListener('change', updateOutput);
      });

      applyPreset('custom');
    </script>
  </body>
</html>
