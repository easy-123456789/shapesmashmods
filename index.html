<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShapeSmash Mod Generator</title>
    <style>
      :root {
        --bg: #020817;
        --bg-2: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --border: #334155;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --green: #34d399;
        --danger: #f87171;
        --code: #0b1120;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 24px 18px 48px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin-bottom: 18px;
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(360px, 520px) minmax(420px, 1fr);
        gap: 22px;
      }

      .panel {
        border: 1px solid var(--border);
        background: rgba(17, 24, 39, 0.96);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
      }

      .controls { padding: 18px; }
      .preview { padding: 16px; }

      .section {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 14px;
        background: rgba(15, 23, 42, 0.72);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .section-title {
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(130px, 1fr));
        gap: 10px 12px;
      }

      .field { display: grid; gap: 6px; }
      .field.full { grid-column: 1 / -1; }

      label {
        font-size: 0.82rem;
        color: var(--muted);
      }

      input, select, textarea, button {
        border-radius: 10px;
        border: 1px solid var(--border);
        font: inherit;
      }

      input, select {
        background: var(--panel-2);
        color: var(--text);
        padding: 9px 10px;
      }

      input[type="checkbox"] { width: 18px; height: 18px; }
      input[type="color"] {
        min-height: 42px;
        padding: 4px;
        background: #0f172a;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
      }

      textarea {
        width: 100%;
        min-height: 540px;
        resize: vertical;
        background: var(--code);
        color: #dbeafe;
        border-color: var(--border);
        line-height: 1.45;
        padding: 16px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        cursor: pointer;
        padding: 10px 14px;
        font-weight: 700;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:hover { transform: translateY(-1px); }

      .primary {
        background: linear-gradient(135deg, var(--accent), #2563eb);
        border-color: transparent;
        color: white;
      }

      .secondary {
        background: var(--panel-2);
        color: var(--text);
      }

      .success {
        background: rgba(52, 211, 153, 0.12);
        border-color: rgba(52, 211, 153, 0.4);
        color: #bbf7d0;
      }

      .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(52, 211, 153, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.4);
        color: #bbf7d0;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
        display: inline-block;
      }

      @media (max-width: 980px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ShapeSmash Mod Generator</h1>
      <div class="subtitle">Build a fighter with custom attacks, directional specials, final smashes, and an image layer.</div>

      <div class="layout">
        <section class="panel controls">
          <div class="section">
            <div class="section-header"><div class="section-title">Preset fighter</div></div>
            <div class="form-grid">
              <div class="field full">
                <label for="fighterPresetSelect">Fighter preset</label>
                <select id="fighterPresetSelect">
                  <option value="custom">Custom</option>
                  <option value="brawler">Brawler</option>
                  <option value="speedster">Speedster</option>
                  <option value="glass">Glass Cannon</option>
                  <option value="tank">Tank</option>
                  <option value="ranger">Ranger</option>
                  <option value="acrobat">Acrobat</option>
                  <option value="mage">Mage</option>
                  <option value="support">Support</option>
                  <option value="shadow">Shadow Assassin</option>
                </select>
              </div>
              <div class="field full">
                <div class="button-row">
                  <button type="button" class="primary" id="loadFighterPresetBtn">Load fighter</button>
                  <button type="button" class="secondary" id="randomBtn">Randomize</button>
                </div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">Attack preset</div></div>
            <div class="form-grid">
              <div class="field full">
                <label for="attackPresetSelect">Attack style</label>
                <select id="attackPresetSelect">
                  <option value="custom">Custom attack</option>
                  <option value="jab">Jab</option>
                  <option value="uppercut">Uppercut</option>
                  <option value="slash">Arc Slash</option>
                  <option value="lunge">Lunge</option>
                  <option value="spin">Spin Kick</option>
                  <option value="dash">Dash Strike</option>
                  <option value="sweep">Sweep</option>
                  <option value="burst">Burst Blast</option>
                  <option value="beam">Beam</option>
                  <option value="volley">Volley</option>
                  <option value="hook">Hook</option>
                  <option value="hammer">Hammer</option>
                  <option value="drill">Drill</option>
                  <option value="meteor">Meteor</option>
                  <option value="nova">Nova</option>
                  <option value="whip">Whip</option>
                  <option value="stomp">Stomp</option>
                  <option value="orb">Orb</option>
                  <option value="snare">Snare</option>
                  <option value="tornado">Tornado</option>
                  <option value="cross">Cross Strike</option>
                  <option value="airslash">Aerial Slash</option>
                  <option value="shieldbash">Shield Bash</option>
                  <option value="divine">Divine Wave</option>
                  <option value="shadow">Shadow Cut</option>
                </select>
              </div>
              <div class="field full">
                <button type="button" class="primary" id="loadAttackPresetBtn">Load attack</button>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">Basic stats</div></div>
            <div class="form-grid">
              <div class="field full"><label for="key">Key</label><input id="key" value="custom-fighter" /></div>
              <div class="field full"><label for="name">Name</label><input id="name" value="Custom Fighter" /></div>
              <div class="field full"><label for="color">Color</label><input id="color" type="color" value="#38bdf8" /></div>
              <div class="field full"><label for="mySrc">Image URL</label><input id="mySrc" placeholder="https://example.com/fighter.png" /></div>
              <div class="field full"><label for="spriteKey">Sprite key</label><input id="spriteKey" placeholder="p1Img" /></div>
              <div class="field full"><label for="description">Flavor text</label><input id="description" value="A flexible arena fighter." /></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">Movement</div></div>
            <div class="form-grid">
              <div class="field"><label for="speed">Speed</label><input id="speed" type="number" step="0.1" value="1.3" /></div>
              <div class="field"><label for="jumpMultiplier">Jump</label><input id="jumpMultiplier" type="number" step="0.1" value="1.2" /></div>
              <div class="field"><label for="sizeMultiplier">Size</label><input id="sizeMultiplier" type="number" step="0.1" value="1.0" /></div>
              <div class="field"><label for="glideFallSpeed">Glide speed</label><input id="glideFallSpeed" type="number" step="0.1" value="2.3" /></div>
              <div class="field"><label for="glideGravityMultiplier">Glide gravity</label><input id="glideGravityMultiplier" type="number" step="0.01" value="0.08" /></div>
              <div class="field"><label for="canGlide">Glide</label><div class="checkbox-row"><input id="canGlide" type="checkbox" checked /><span>Enabled</span></div></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">Combat tuning</div></div>
            <div class="form-grid">
              <div class="field"><label for="attackMultiplier">Attack mult</label><input id="attackMultiplier" type="number" step="0.1" value="1.5" /></div>
              <div class="field"><label for="fallDamageMultiplier">Fall damage mult</label><input id="fallDamageMultiplier" type="number" step="0.1" value="1.0" /></div>
              <div class="field"><label for="specialPower">Special power</label><input id="specialPower" type="number" step="1" value="18" /></div>
              <div class="field"><label for="specialCooldown">Special cooldown</label><input id="specialCooldown" type="number" step="1" value="45" /></div>
              <div class="field"><label for="attackWindup">Windup</label><input id="attackWindup" type="number" step="1" value="10" /></div>
              <div class="field"><label for="attackRange">Range</label><input id="attackRange" type="number" step="1" value="26" /></div>
              <div class="field"><label for="attackKnockback">Knockback</label><input id="attackKnockback" type="number" step="1" value="15" /></div>
              <div class="field"><label for="attackSpeed">Attack speed</label><input id="attackSpeed" type="number" step="0.1" value="1.2" /></div>
              <div class="field"><label for="projectileSpeed">Projectile speed</label><input id="projectileSpeed" type="number" step="1" value="14" /></div>
              <div class="field"><label for="leapStrength">Leap strength</label><input id="leapStrength" type="number" step="1" value="12" /></div>
              <div class="field"><label for="effectRadius">AoE radius</label><input id="effectRadius" type="number" step="1" value="18" /></div>
              <div class="field"><label for="passiveFallDamage">Passive fall damage</label><div class="checkbox-row"><input id="passiveFallDamage" type="checkbox" /><span>Enabled</span></div></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">Special editor</div></div>
            <div class="form-grid">
              <div class="field full"><label for="specialName">Special name</label><input id="specialName" value="Burst Cannon" /></div>
              <div class="field">
                <label for="specialType">Type</label>
                <select id="specialType">
                  <option value="burst">Burst</option>
                  <option value="beam">Beam</option>
                  <option value="nova">Nova</option>
                  <option value="dash">Dash</option>
                  <option value="snare">Snare</option>
                  <option value="orbital">Orbital</option>
                  <option value="upspec">Up Special</option>
                  <option value="downspec">Down Special</option>

                  <option value="rightspec">Right Special</option>

                  <option value="down">Down</option>
                  <option value="left">Left</option>
                  <option value="right">Right</option>

              </div>

              <div class="field"><label for="specialCooldownEditor">Cooldown</label><input id="specialCooldownEditor" type="number" step="1" value="38" /></div>

              <div class="field"><label for="specialRadiusEditor">Radius</label><input id="specialRadiusEditor" type="number" step="1" value="20" /></div>
              <div class="field full"><label for="specialText">Special text</label><input id="specialText" value="fires a bright burst that tears through the lane!" /></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">FS editor</div></div>
            <div class="form-grid">
              <div class="field full"><label for="finalName">Final smash name</label><input id="finalName" value="Meteor Finale" /></div>
              <div class="field">
                <label for="finalType">Type</label>
                <select id="finalType">
                  <option value="meteor">Meteor</option>
                  <option value="divine">Divine</option>
                  <option value="tornado">Tornado</option>
                  <option value="nova">Nova</option>
                  <option value="shadow">Shadow</option>
                  <option value="storm">Storm</option>
                  <option value="upsmash">Up Smash</option>
                  <option value="downsmash">Down Smash</option>
                  <option value="leftsmash">Left Smash</option>
                  <option value="rightsmash">Right Smash</option>
                </select>
              </div>
              <div class="field">
                <label for="finalDirection">Direction</label>
                <select id="finalDirection">
                  <option value="forward">Forward</option>
                  <option value="up">Up</option>
                  <option value="down">Down</option>
                  <option value="left">Left</option>
                  <option value="right">Right</option>
                </select>
              </div>
              <div class="field"><label for="finalPower">Power</label><input id="finalPower" type="number" step="1" value="28" /></div>
              <div class="field"><label for="finalCooldown">Cooldown</label><input id="finalCooldown" type="number" step="1" value="84" /></div>
              <div class="field"><label for="finalRadius">Radius</label><input id="finalRadius" type="number" step="1" value="24" /></div>
              <div class="field full"><label for="finalText">Final smash text</label><input id="finalText" value="drops an impossible meteor blow across the arena!" /></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">Image editor</div></div>
            <div class="form-grid">
              <div class="field full"><label for="imageUrl">Image URL</label><input id="imageUrl" placeholder="https://example.com/fighter.png" /></div>
              <div class="field full"><label for="imageSpriteKey">Sprite key</label><input id="imageSpriteKey" placeholder="p1Img" /></div>
              <div class="field"><label for="imageScale">Scale</label><input id="imageScale" type="number" step="0.1" value="1.0" /></div>
              <div class="field"><label for="imageOffsetX">Offset X</label><input id="imageOffsetX" type="number" step="1" value="0" /></div>
              <div class="field"><label for="imageOffsetY">Offset Y</label><input id="imageOffsetY" type="number" step="1" value="0" /></div>
              <div class="field"><label for="imageTint">Tint</label><input id="imageTint" type="color" value="#ffffff" /></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">Controls</div></div>
            <div class="form-grid">
              <div class="field"><label for="leftKey">Left</label><input id="leftKey" value="a" /></div>
              <div class="field"><label for="rightKey">Right</label><input id="rightKey" value="d" /></div>
              <div class="field"><label for="jumpKey">Jump</label><input id="jumpKey" value="w" /></div>
              <div class="field"><label for="attackKey">Attack</label><input id="attackKey" value="f" /></div>
              <div class="field"><label for="finalKey">Final</label><input id="finalKey" value="g" /></div>
              <div class="field"><label for="specialKey">Special</label><input id="specialKey" value="s" /></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header"><div class="section-title">Output</div></div>
            <div class="button-row">
              <button type="button" class="primary" id="generateBtn">Generate mod</button>
              <button type="button" class="secondary" id="copyBtn">Copy code</button>
              <button type="button" class="success" id="downloadBtn">Download .js</button>
            </div>
          </div>
        </section>

        <section class="panel preview">
          <div class="preview-header">
            <strong>Generated mod</strong>
            <span class="live-badge"><span class="dot"></span>Ready</span>
          </div>
          <textarea id="output" aria-label="Generated mod code"></textarea>
        </section>
      </div>
    </div>

      function setFieldValue(id, value) {

        else el.value = value;
      }

      function getValue(id, fallback = '') {
        const el = document.getElementById(id);
        if (!el) return fallback;
        if (el.type === 'checkbox') return el.checked;
        return el.value !== '' ? el.value : fallback;
      }

      function escapeString(value) {
        return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");

      function applyFighterPreset(name) {
        const preset = fighterPresets[name];
        if (!preset) return;
        const map = {
          key: 'key', name: 'name', color: 'color', mySrc: 'mySrc', spriteKey: 'spriteKey', description: 'description',
          speed: 'speed', jumpMultiplier: 'jumpMultiplier', canGlide: 'canGlide', glideGravityMultiplier: 'glideGravityMultiplier',

          specialCooldown: 'specialCooldown', attackWindup: 'attackWindup', attackRange: 'attackRange', attackKnockback: 'attackKnockback',
          attackSpeed: 'attackSpeed', projectileSpeed: 'projectileSpeed', leapStrength: 'leapStrength', effectRadius: 'effectRadius',
          leftKey: 'leftKey', rightKey: 'rightKey', jumpKey: 'jumpKey', attackKey: 'attackKey', finalKey: 'finalKey', specialKey: 'specialKey'

        Object.entries(map).forEach(([fieldId, presetKey]) => setFieldValue(fieldId, preset[presetKey]));

        Object.entries(map).forEach(([fieldId, presetKey]) => setFieldValue(fieldId, preset[presetKey]));

      function buildAttackFunction() {
        const selected = document.getElementById('attackPresetSelect').value || 'custom';
        const attack = attackPresets[selected] || attackPresets.custom;
        const windup = Number(getValue('attackWindup', attack.attackWindup));
        const code = attack.attackCode || 'fighter.vx += fighter.facing * 10;';
        return "\n  attack(fighter, opponent) {\n    if (fighter.stocks <= 0 || fighter.attackCooldown > 0 || fighter.stunned > 0) return;\n    fighter.attackCooldown = " + (windup + 8) + ";\n    fighter.punchFrame = 0;\n    fighter.punchAnimating = true;\n    " + code + "\n  },";
      }

      function buildSpecialFunction() {
        const selected = document.getElementById('specialType').value || 'burst';
        const preset = specialPresets[selected] || specialPresets.custom;
        const direction = document.getElementById('specialDirection').value || preset.direction || 'forward';
        const power = Number(getValue('specialPowerEditor', preset.power));
        const cooldown = Number(getValue('specialCooldownEditor', preset.cooldown));
        const speed = Number(getValue('specialSpeedEditor', preset.speed));
        const radius = Number(getValue('specialRadiusEditor', preset.radius));
        const text = getValue('specialText', 'launches a signature special!');

        const codeByDirection = {
          forward: "fighter.vx += fighter.facing * " + speed + "; if (opponent) { opponent.vx += fighter.facing * " + Math.max(6, Math.round(power / 2)) + "; opponent.vy -= " + Math.max(1, Math.round(radius / 5)) + "; } addCommentary(fighter.name + ' " + text + "');",
          up: "fighter.vy -= " + Math.max(6, Math.round(power / 2) + 3) + "; fighter.vx += fighter.facing * " + Math.max(4, Math.round(speed / 3)) + "; if (opponent) { opponent.vy -= " + Math.max(5, Math.round(radius / 4)) + "; opponent.vx += fighter.facing * " + Math.max(3, Math.round(speed / 5)) + "; } addCommentary(fighter.name + ' " + text + "');",

        };

        return "\n  special(fighter, opponent) {\n    if (fighter.specialCooldown > 0 || fighter.stunned > 0) return;\n    fighter.specialCooldown = " + cooldown + ";\n    " + (codeByDirection[direction] || codeByDirection.forward) + "\n  },";

      function buildFinalFunction() {

        const key = String(getValue('key', 'custom-fighter') || 'custom-fighter').trim();

        const attackFn = buildAttackFunction();
        const specialFn = buildSpecialFunction();
        const finalFn = buildFinalFunction();
        const imageFn = buildImageCreator();

        return "Mods.registerCharacter({\n  key: '" + escapeString(key) + "',\n  name: '" + escapeString(name) + "',\n  color: '" + escapeString(color) + "',\n  description: '" + escapeString(description) + "',\n  mySrc: " + (mySrc ? "'" + escapeString(mySrc) + "'" : 'undefined') + ",\n  spriteKey: " + (spriteKey ? "'" + escapeString(spriteKey) + "'" : 'undefined') + ",\n  speed: " + speed + ",\n  jumpMultiplier: " + jumpMultiplier + ",\n  canGlide: " + canGlide + ",\n  glideGravityMultiplier: " + glideGravityMultiplier + ",\n  glideFallSpeed: " + glideFallSpeed + ",\n  sizeMultiplier: " + sizeMultiplier + ",\n  attackMultiplier: " + attackMultiplier + ",\n  fallDamageMultiplier: " + fallDamageMultiplier + ",\n  passiveFallDamage: " + passiveFallDamage + ",\n  specialPower: " + specialPower + ",\n  specialCooldown: " + specialCooldown + ",\n  attackWindup: " + attackWindup + ",\n  attackRange: " + attackRange + ",\n  attackKnockback: " + attackKnockback + ",\n  attackSpeed: " + attackSpeed + ",\n  projectileSpeed: " + projectileSpeed + ",\n  leapStrength: " + leapStrength + ",\n  effectRadius: " + effectRadius + ",\n  keys: {\n    left: '" + keys.left + "',\n    right: '" + keys.right + "',\n    jump: '" + keys.jump + "',\n    attack: '" + keys.attack + "',\n    final: '" + keys.final + "',\n    special: '" + keys.special + "'\n  },\n  " + imageFn + "\n  " + attackFn + "\n  " + specialFn + "\n  " + finalFn + "\n});";

      function copyCode() {
        const output = document.getElementById('output');
        output.select();
        navigator.clipboard.writeText(output.value).then(() => {
          const btn = document.getElementById('copyBtn');
          const oldText = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = oldText; }, 1000);
        }).catch(() => alert('Unable to copy automatically. Select the text manually.'));
      }

      function downloadFile() {
        const text = document.getElementById('output').value;
        const filename = (document.getElementById('key').value || 'custom-fighter').trim() || 'custom-fighter';
        const blob = new Blob([text + '\n'], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename + '.js';
        a.click();
        URL.revokeObjectURL(url);
      }

      function randomizeForm() {
        const fighterNames = Object.keys(fighterPresets).filter((name) => name !== 'custom');
        const attackNames = Object.keys(attackPresets).filter((name) => name !== 'custom');
        const specialNames = Object.keys(specialPresets).filter((name) => name !== 'custom');
        const finalNames = Object.keys(finalPresets).filter((name) => name !== 'custom');

        const randomFighter = fighterNames[Math.floor(Math.random() * fighterNames.length)];
        const randomAttack = attackNames[Math.floor(Math.random() * attackNames.length)];
        const randomSpecial = specialNames[Math.floor(Math.random() * specialNames.length)];
        const randomFinal = finalNames[Math.floor(Math.random() * finalNames.length)];

        document.getElementById('fighterPresetSelect').value = randomFighter;
        document.getElementById('attackPresetSelect').value = randomAttack;
        document.getElementById('specialType').value = randomSpecial;
        document.getElementById('finalType').value = randomFinal;

        applyFighterPreset(randomFighter);
        applyAttackPreset(randomAttack);
        applySpecialPreset(randomSpecial);
        applyFinalPreset(randomFinal);
        updateOutput();
      }

      document.getElementById('generateBtn').addEventListener('click', updateOutput);
      document.getElementById('copyBtn').addEventListener('click', copyCode);
      document.getElementById('downloadBtn').addEventListener('click', downloadFile);
      document.getElementById('randomBtn').addEventListener('click', randomizeForm);
      document.getElementById('loadFighterPresetBtn').addEventListener('click', () => { applyFighterPreset(document.getElementById('fighterPresetSelect').value); updateOutput(); });
      document.getElementById('loadAttackPresetBtn').addEventListener('click', () => { applyAttackPreset(document.getElementById('attackPresetSelect').value); updateOutput(); });

      document.getElementById('specialType').addEventListener('change', () => {
        const selected = document.getElementById('specialType').value;
        const preset = specialPresets[selected] || specialPresets.custom;
        setFieldValue('specialPowerEditor', preset.power);
        setFieldValue('specialCooldownEditor', preset.cooldown);
        setFieldValue('specialSpeedEditor', preset.speed);
        setFieldValue('specialRadiusEditor', preset.radius);
        setFieldValue('specialDirection', preset.direction || 'forward');
        setFieldValue('specialText', 'launches a ' + (preset.label || 'special') + ' burst!');
        updateOutput();
      });

      document.getElementById('finalType').addEventListener('change', () => {
        const selected = document.getElementById('finalType').value;
        const preset = finalPresets[selected] || finalPresets.meteor;
        setFieldValue('finalPower', preset.power);
        setFieldValue('finalCooldown', preset.cooldown);
        setFieldValue('finalRadius', preset.radius);
        setFieldValue('finalDirection', preset.direction || 'forward');
        setFieldValue('finalText', 'unleashes ' + (preset.label || 'final smash') + ' across the arena!');
        updateOutput();
      });

      document.querySelectorAll('input, select').forEach((element) => {
        element.addEventListener('input', updateOutput);
        element.addEventListener('change', updateOutput);
      });

      applyFighterPreset('custom');
      applyAttackPreset('custom');
      applySpecialPreset('custom');
      applyFinalPreset('custom');
      updateOutput();
    </script>
  </body>
</html>
