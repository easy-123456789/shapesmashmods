<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShapeSmash Mod Generator</title>
    <style>
      :root {
        --bg: #020817;
        --bg-2: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --border: #334155;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --green: #34d399;
        --danger: #f87171;
        --code: #0b1120;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1500px;
        margin: 0 auto;
        padding: 24px 18px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin-bottom: 18px;
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(360px, 520px) minmax(420px, 1fr);
        gap: 22px;
      }

      .panel {
        border: 1px solid var(--border);
        background: rgba(17, 24, 39, 0.96);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
      }

      .controls { padding: 18px; }
      .preview { padding: 16px; }

      .section {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 14px;
        background: rgba(15, 23, 42, 0.72);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .section-title {
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(130px, 1fr));
        gap: 10px 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 0.82rem;
        color: var(--muted);
      }

      input, select, textarea, button {
        border-radius: 10px;
        border: 1px solid var(--border);
        font: inherit;
      }

      input, select {
        background: var(--panel-2);
        color: var(--text);
        padding: 9px 10px;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
      }

      input[type="color"] {
        min-height: 42px;
        padding: 4px;
        background: #0f172a;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
      }

      textarea {
        width: 100%;
        min-height: 560px;
        resize: vertical;
        background: var(--code);
        color: #dbeafe;
        border-color: var(--border);
        line-height: 1.45;
        padding: 16px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        cursor: pointer;
        padding: 10px 14px;
        font-weight: 700;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:hover { transform: translateY(-1px); }

      .primary {
        background: linear-gradient(135deg, var(--accent), #2563eb);
        border-color: transparent;
        color: white;
      }

      .secondary {
        background: var(--panel-2);
        color: var(--text);
      }

      .success {
        background: rgba(52, 211, 153, 0.12);
        border-color: rgba(52, 211, 153, 0.4);
        color: #bbf7d0;
      }

      .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(52, 211, 153, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.4);
        color: #bbf7d0;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
        display: inline-block;
      }

      @media (max-width: 980px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ShapeSmash Mod Generator</h1>
      <div class="subtitle">Pick a fighter, choose an attack style, customize the numbers, and export a JavaScript mod.</div>

      <div class="layout">
        <section class="panel controls">
          <div class="section">
            <div class="section-header">
              <div class="section-title">Preset fighter</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="fighterPresetSelect">Fighter preset</label>
                <select id="fighterPresetSelect">
                  <option value="custom">Custom</option>
                  <option value="brawler">Brawler</option>
                  <option value="speedster">Speedster</option>
                  <option value="glass">Glass Cannon</option>
                  <option value="tank">Tank</option>
                  <option value="ranger">Ranger</option>
                  <option value="acrobat">Acrobat</option>
                  <option value="mage">Mage</option>
                  <option value="support">Support</option>
                  <option value="shadow">Shadow Assassin</option>
                </select>
              </div>
              <div class="field full">
                <div class="button-row">
                  <button type="button" class="primary" id="loadFighterPresetBtn">Load fighter</button>
                  <button type="button" class="secondary" id="randomBtn">Randomize</button>
                </div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Attack preset</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="attackPresetSelect">Attack style</label>
                <select id="attackPresetSelect">
                  <option value="custom">Custom attack</option>
                  <option value="jab">Jab</option>
                  <option value="uppercut">Uppercut</option>
                  <option value="slash">Arc Slash</option>
                  <option value="lunge">Lunge</option>
                  <option value="spin">Spin Kick</option>
                  <option value="dash">Dash Strike</option>
                  <option value="sweep">Sweep</option>
                  <option value="burst">Burst Blast</option>
                  <option value="beam">Beam</option>
                  <option value="volley">Volley</option>
                  <option value="hook">Hook</option>
                  <option value="hammer">Hammer</option>
                  <option value="drill">Drill</option>
                  <option value="meteor">Meteor</option>
                  <option value="nova">Nova</option>
                  <option value="whip">Whip</option>
                  <option value="stomp">Stomp</option>
                  <option value="orb">Orb</option>
                  <option value="snare">Snare</option>
                  <option value="tornado">Tornado</option>
                  <option value="cross">Cross Strike</option>
                  <option value="airslash">Aerial Slash</option>
                  <option value="shieldbash">Shield Bash</option>
                  <option value="divine">Divine Wave</option>
                  <option value="shadow">Shadow Cut</option>
                </select>
              </div>
              <div class="field full">
                <div class="button-row">
                  <button type="button" class="primary" id="loadAttackPresetBtn">Load attack</button>
                </div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Special preset</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="specialPresetSelect">Special move</label>
                <select id="specialPresetSelect">
                  <option value="custom">Custom special</option>
                  <option value="burst">Burst</option>
                  <option value="beam">Beam</option>
                  <option value="nova">Nova</option>
                  <option value="dash">Dash</option>
                  <option value="snare">Snare</option>
                  <option value="orbital">Orbital</option>
                </select>
              </div>
              <div class="field full">
                <div class="button-row">
                  <button type="button" class="primary" id="loadSpecialPresetBtn">Load special</button>
                </div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">FS preset</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="fsPresetSelect">Final smash</label>
                <select id="fsPresetSelect">
                  <option value="custom">Custom FS</option>
                  <option value="meteor">Meteor</option>
                  <option value="divine">Divine Burst</option>
                  <option value="tornado">Tornado</option>
                  <option value="nova">Nova Break</option>
                  <option value="shadow">Shadow Finish</option>
                  <option value="storm">Storm Rush</option>
                </select>
              </div>
              <div class="field full">
                <div class="button-row">
                  <button type="button" class="primary" id="loadFSPresetBtn">Load FS</button>
                </div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Basic stats</div>
            </div>
            <div class="form-grid">
              <div class="field full"><label for="key">Key</label><input id="key" value="custom-fighter" /></div>
              <div class="field full"><label for="name">Name</label><input id="name" value="Custom Fighter" /></div>
              <div class="field full"><label for="color">Color</label><input id="color" type="color" value="#38bdf8" /></div>
              <div class="field full"><label for="mySrc">Image URL</label><input id="mySrc" placeholder="https://example.com/fighter.png" /></div>
              <div class="field full"><label for="spriteKey">Sprite key</label><input id="spriteKey" placeholder="p1Img" /></div>
              <div class="field full"><label for="description">Flavor text</label><input id="description" value="A flexible arena fighter." /></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Movement</div>
            </div>
            <div class="form-grid">
              <div class="field"><label for="speed">Speed</label><input id="speed" type="number" step="0.1" value="1.3" /></div>
              <div class="field"><label for="jumpMultiplier">Jump</label><input id="jumpMultiplier" type="number" step="0.1" value="1.2" /></div>
              <div class="field"><label for="sizeMultiplier">Size</label><input id="sizeMultiplier" type="number" step="0.1" value="1.0" /></div>
              <div class="field"><label for="glideFallSpeed">Glide speed</label><input id="glideFallSpeed" type="number" step="0.1" value="2.3" /></div>
              <div class="field"><label for="glideGravityMultiplier">Glide gravity</label><input id="glideGravityMultiplier" type="number" step="0.01" value="0.08" /></div>
              <div class="field">
                <label for="canGlide">Glide</label>
                <div class="checkbox-row"><input id="canGlide" type="checkbox" checked /><span>Enabled</span></div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Combat tuning</div>
            </div>
            <div class="form-grid">
              <div class="field"><label for="attackMultiplier">Attack mult</label><input id="attackMultiplier" type="number" step="0.1" value="1.5" /></div>
              <div class="field"><label for="fallDamageMultiplier">Fall damage mult</label><input id="fallDamageMultiplier" type="number" step="0.1" value="1.0" /></div>
              <div class="field"><label for="specialPower">Special power</label><input id="specialPower" type="number" step="1" value="18" /></div>
              <div class="field"><label for="specialCooldown">Special cooldown</label><input id="specialCooldown" type="number" step="1" value="45" /></div>
              <div class="field"><label for="attackWindup">Windup</label><input id="attackWindup" type="number" step="1" value="10" /></div>
              <div class="field"><label for="attackRange">Range</label><input id="attackRange" type="number" step="1" value="26" /></div>
              <div class="field"><label for="attackKnockback">Knockback</label><input id="attackKnockback" type="number" step="1" value="15" /></div>
              <div class="field"><label for="attackSpeed">Attack speed</label><input id="attackSpeed" type="number" step="0.1" value="1.2" /></div>
              <div class="field"><label for="projectileSpeed">Projectile speed</label><input id="projectileSpeed" type="number" step="1" value="14" /></div>
              <div class="field"><label for="leapStrength">Leap strength</label><input id="leapStrength" type="number" step="1" value="12" /></div>
              <div class="field"><label for="effectRadius">AoE radius</label><input id="effectRadius" type="number" step="1" value="18" /></div>
              <div class="field">
                <label for="passiveFallDamage">Passive fall damage</label>
                <div class="checkbox-row"><input id="passiveFallDamage" type="checkbox" /><span>Enabled</span></div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Controls</div>
            </div>
            <div class="form-grid">
              <div class="field"><label for="leftKey">Left</label><input id="leftKey" value="a" /></div>
              <div class="field"><label for="rightKey">Right</label><input id="rightKey" value="d" /></div>
              <div class="field"><label for="jumpKey">Jump</label><input id="jumpKey" value="w" /></div>
              <div class="field"><label for="attackKey">Attack</label><input id="attackKey" value="f" /></div>
              <div class="field"><label for="finalKey">Final</label><input id="finalKey" value="g" /></div>
              <div class="field"><label for="specialKey">Special</label><input id="specialKey" value="s" /></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Output</div>
            </div>
            <div class="button-row">
              <button type="button" class="primary" id="generateBtn">Generate mod</button>
              <button type="button" class="secondary" id="copyBtn">Copy code</button>
              <button type="button" class="success" id="downloadBtn">Download .js</button>
            </div>
          </div>
        </section>

        <section class="panel preview">
          <div class="preview-header">
            <strong>Generated mod</strong>
            <span class="live-badge"><span class="dot"></span>Ready</span>
          </div>
          <textarea id="output" aria-label="Generated mod code"></textarea>
        </section>
      </div>
    </div>

        volley: { label: 'Volley', attackType: 'volley', attackWindup: 12, attackRange: 38, attackKnockback: 13, attackSpeed: 1.1, projectileSpeed: 20, leapStrength: 11, effectRadius: 14, attackText: 'launches a rapid volley of strikes!' },
        hook: { label: 'Hook', attackType: 'hook', attackWindup: 8, attackRange: 20, attackKnockback: 15, attackSpeed: 1.5, projectileSpeed: 7, leapStrength: 9, effectRadius: 11, attackText: 'hooks in with a nasty, fast counter-punch!' },
        hammer: { label: 'Hammer', attackType: 'hammer', attackWindup: 14, attackRange: 22, attackKnockback: 26, attackSpeed: 0.7, projectileSpeed: 8, leapStrength: 15, effectRadius: 24, attackText: 'drops a heavy hammer strike onto the target!' },
        drill: { label: 'Drill', attackType: 'drill', attackWindup: 10, attackRange: 26, attackKnockback: 20, attackSpeed: 1.45, projectileSpeed: 13, leapStrength: 13, effectRadius: 18, attackText: 'drills through the target with a spinning impact!' },
        meteor: { label: 'Meteor', attackType: 'meteor', attackWindup: 16, attackRange: 36, attackKnockback: 28, attackSpeed: 0.75, projectileSpeed: 18, leapStrength: 17, effectRadius: 24, attackText: 'brings down a fiery meteor crash!' },
        nova: { label: 'Nova', attackType: 'nova', attackWindup: 18, attackRange: 42, attackKnockback: 22, attackSpeed: 0.65, projectileSpeed: 22, leapStrength: 12, effectRadius: 28, attackText: 'erupts in a radiant nova burst!' },
        whip: { label: 'Whip', attackType: 'whip', attackWindup: 9, attackRange: 34, attackKnockback: 12, attackSpeed: 1.25, projectileSpeed: 16, leapStrength: 10, effectRadius: 15, attackText: 'snaps a whipping arc across the field!' },
        stomp: { label: 'Stomp', attackType: 'stomp', attackWindup: 14, attackRange: 20, attackKnockback: 24, attackSpeed: 0.8, projectileSpeed: 7, leapStrength: 20, effectRadius: 26, attackText: 'drops a brutal ground stomp!' },
        orb: { label: 'Orb', attackType: 'orb', attackWindup: 10, attackRange: 31, attackKnockback: 16, attackSpeed: 1.1, projectileSpeed: 20, leapStrength: 12, effectRadius: 18, attackText: 'launches a glowing orb of force!' },
        snare: { label: 'Snare', attackType: 'snare', attackWindup: 11, attackRange: 28, attackKnockback: 13, attackSpeed: 1.0, projectileSpeed: 15, leapStrength: 9, effectRadius: 17, attackText: 'fires a snare trap that catches the target!' },
        tornado: { label: 'Tornado', attackType: 'tornado', attackWindup: 13, attackRange: 30, attackKnockback: 19, attackSpeed: 1.0, projectileSpeed: 15, leapStrength: 13, effectRadius: 23, attackText: 'spins up a destructive tornado of force!' },
        cross: { label: 'Cross Strike', attackType: 'cross', attackWindup: 10, attackRange: 22, attackKnockback: 17, attackSpeed: 1.3, projectileSpeed: 11, leapStrength: 11, effectRadius: 13, attackText: 'fires a clean cross strike with perfect timing!' },
        airslash: { label: 'Aerial Slash', attackType: 'airslash', attackWindup: 8, attackRange: 30, attackKnockback: 18, attackSpeed: 1.5, projectileSpeed: 12, leapStrength: 17, effectRadius: 18, attackText: 'slashes through the air with an aerial finisher!' },
        shieldbash: { label: 'Shield Bash', attackType: 'shieldbash', attackWindup: 12, attackRange: 24, attackKnockback: 23, attackSpeed: 0.9, projectileSpeed: 7, leapStrength: 10, effectRadius: 20, attackText: 'charges a heavy shield bash and knocks them back!' },
        divine: { label: 'Divine Wave', attackType: 'divine', attackWindup: 15, attackRange: 40, attackKnockback: 17, attackSpeed: 0.8, projectileSpeed: 21, leapStrength: 12, effectRadius: 25, attackText: 'releases a radiant divine wave!' },
        shadow: { label: 'Shadow Cut', attackType: 'shadow', attackWindup: 7, attackRange: 27, attackKnockback: 19, attackSpeed: 1.7, projectileSpeed: 17, leapStrength: 14, effectRadius: 15, attackText: 'cuts through the darkness with a sharp shadow strike!' }
      };

      const specialPresets = {
        custom: { label: 'Custom special', specialPower: 18, specialCooldown: 45, attackMultiplier: 1.5, projectileSpeed: 14, effectRadius: 18 },
        burst: { label: 'Burst', specialPower: 24, specialCooldown: 38, attackMultiplier: 1.7, projectileSpeed: 18, effectRadius: 20 },
        beam: { label: 'Beam', specialPower: 27, specialCooldown: 50, attackMultiplier: 1.8, projectileSpeed: 22, effectRadius: 18 },
        nova: { label: 'Nova', specialPower: 31, specialCooldown: 62, attackMultiplier: 2.0, projectileSpeed: 24, effectRadius: 24 },
        dash: { label: 'Dash', specialPower: 22, specialCooldown: 35, attackMultiplier: 1.6, projectileSpeed: 19, effectRadius: 16 },
        snare: { label: 'Snare', specialPower: 19, specialCooldown: 48, attackMultiplier: 1.45, projectileSpeed: 16, effectRadius: 17 },
        orbital: { label: 'Orbital', specialPower: 26, specialCooldown: 58, attackMultiplier: 1.9, projectileSpeed: 23, effectRadius: 21 }
      };

      const fsPresets = {
        custom: { label: 'Custom FS', specialPower: 20, specialCooldown: 70, attackMultiplier: 1.8, attackRange: 36, effectRadius: 22 },
        meteor: { label: 'Meteor', specialPower: 28, specialCooldown: 80, attackMultiplier: 2.1, attackRange: 38, effectRadius: 24 },
        divine: { label: 'Divine Burst', specialPower: 30, specialCooldown: 84, attackMultiplier: 2.3, attackRange: 42, effectRadius: 26 },
        tornado: { label: 'Tornado', specialPower: 26, specialCooldown: 76, attackMultiplier: 2.0, attackRange: 34, effectRadius: 25 },
        nova: { label: 'Nova Break', specialPower: 32, specialCooldown: 90, attackMultiplier: 2.4, attackRange: 44, effectRadius: 28 },
        shadow: { label: 'Shadow Finish', specialPower: 27, specialCooldown: 74, attackMultiplier: 2.1, attackRange: 35, effectRadius: 20 },
        storm: { label: 'Storm Rush', specialPower: 29, specialCooldown: 78, attackMultiplier: 2.2, attackRange: 40, effectRadius: 23 }
      };

      function setFieldValue(id, value) {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.type === 'checkbox') {
          el.checked = Boolean(value);
        } else {
          el.value = value;
        }
      }

      function getValue(id, fallback = '') {
        const el = document.getElementById(id);
        if (!el) return fallback;
        if (el.type === 'checkbox') return el.checked;
        return el.value !== '' ? el.value : fallback;
      }

      function applyFighterPreset(name) {
        const preset = fighterPresets[name];
        if (!preset) return;

        Object.entries({
          key: 'key', name: 'name', color: 'color', mySrc: 'mySrc', spriteKey: 'spriteKey', description: 'description',
          speed: 'speed', jumpMultiplier: 'jumpMultiplier', canGlide: 'canGlide', glideGravityMultiplier: 'glideGravityMultiplier',
          glideFallSpeed: 'glideFallSpeed', sizeMultiplier: 'sizeMultiplier', attackMultiplier: 'attackMultiplier',
          fallDamageMultiplier: 'fallDamageMultiplier', passiveFallDamage: 'passiveFallDamage', specialPower: 'specialPower',
          specialCooldown: 'specialCooldown', attackWindup: 'attackWindup', attackRange: 'attackRange', attackKnockback: 'attackKnockback',
          attackSpeed: 'attackSpeed', projectileSpeed: 'projectileSpeed', leapStrength: 'leapStrength', effectRadius: 'effectRadius',
          leftKey: 'leftKey', rightKey: 'rightKey', jumpKey: 'jumpKey', attackKey: 'attackKey', finalKey: 'finalKey', specialKey: 'specialKey'
        }).forEach(([fieldId, presetKey]) => {
          setFieldValue(fieldId, preset[presetKey]);
        });

        updateOutput();
      }

      function applyAttackPreset(name) {
        const preset = attackPresets[name];
        if (!preset) return;

        Object.entries({
          attackWindup: 'attackWindup',
          attackRange: 'attackRange',
          attackKnockback: 'attackKnockback',
          attackSpeed: 'attackSpeed',
          projectileSpeed: 'projectileSpeed',
          leapStrength: 'leapStrength',
          effectRadius: 'effectRadius'
        }).forEach(([fieldId, presetKey]) => {
          setFieldValue(fieldId, preset[presetKey]);
        });

        setFieldValue('attackType', preset.attackType || name);
        updateOutput();
      }

      function applySpecialPreset(name) {
        const preset = specialPresets[name];
        if (!preset) return;

        Object.entries({
          specialPower: 'specialPower',
          specialCooldown: 'specialCooldown',
          attackMultiplier: 'attackMultiplier',
          projectileSpeed: 'projectileSpeed',
          effectRadius: 'effectRadius'
        }).forEach(([fieldId, presetKey]) => {
          setFieldValue(fieldId, preset[presetKey]);
        });

        updateOutput();
      }

      function applyFSPreset(name) {
        const preset = fsPresets[name];
        if (!preset) return;

        Object.entries({
          specialPower: 'specialPower',
          specialCooldown: 'specialCooldown',
          attackMultiplier: 'attackMultiplier',
          attackRange: 'attackRange',
          effectRadius: 'effectRadius'
        }).forEach(([fieldId, presetKey]) => {
          setFieldValue(fieldId, preset[presetKey]);
        });

        updateOutput();
      }

      function escapeString(value) {
        return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      }

      function buildModText() {
        const key = (getValue('key', 'custom-fighter') || 'custom-fighter').trim() || 'custom-fighter';
        const name = (getValue('name', 'Custom Fighter') || 'Custom Fighter').trim() || 'Custom Fighter';
        const color = getValue('color', '#38bdf8');
        const mySrc = getValue('mySrc', '');
        const spriteKey = getValue('spriteKey', '');
        const description = getValue('description', 'A flexible arena fighter.');
        const speed = Number(getValue('speed', 1.3));
        const jumpMultiplier = Number(getValue('jumpMultiplier', 1.2));
        const canGlide = Boolean(getValue('canGlide', true));
        const glideGravityMultiplier = Number(getValue('glideGravityMultiplier', 0.08));
        const glideFallSpeed = Number(getValue('glideFallSpeed', 2.3));
        const sizeMultiplier = Number(getValue('sizeMultiplier', 1));
        const attackMultiplier = Number(getValue('attackMultiplier', 1.5));
        const fallDamageMultiplier = Number(getValue('fallDamageMultiplier', 1));
        const passiveFallDamage = Boolean(getValue('passiveFallDamage', false));
        const specialPower = Number(getValue('specialPower', 18));
        const specialCooldown = Number(getValue('specialCooldown', 45));
        const attackWindup = Number(getValue('attackWindup', 10));
        const attackRange = Number(getValue('attackRange', 26));
        const attackKnockback = Number(getValue('attackKnockback', 15));
        const attackSpeed = Number(getValue('attackSpeed', 1.2));
        const projectileSpeed = Number(getValue('projectileSpeed', 14));
        const leapStrength = Number(getValue('leapStrength', 12));
        const effectRadius = Number(getValue('effectRadius', 18));
        const keys = {
          left: escapeString(getValue('leftKey', 'a')),
          right: escapeString(getValue('rightKey', 'd')),
          jump: escapeString(getValue('jumpKey', 'w')),
          attack: escapeString(getValue('attackKey', 'f')),
          final: escapeString(getValue('finalKey', 'g')),
          special: escapeString(getValue('specialKey', 's'))
        };

        const mySrcLine = mySrc ? `  mySrc: '${escapeString(mySrc)}',` : '';
        const spriteLine = spriteKey ? `  spriteKey: '${escapeString(spriteKey)}',` : '';
        const descriptionText = `  description: '${escapeString(description)}',`;

        return `Mods.registerCharacter({
  key: '${escapeString(key)}',
  name: '${escapeString(name)}',
  color: '${escapeString(color)}',
${mySrcLine}${spriteLine}${descriptionText}
  speed: ${speed},
  jumpMultiplier: ${jumpMultiplier},
  canGlide: ${canGlide},
  glideGravityMultiplier: ${glideGravityMultiplier},
  glideFallSpeed: ${glideFallSpeed},
  sizeMultiplier: ${sizeMultiplier},
  attackMultiplier: ${attackMultiplier},
  fallDamageMultiplier: ${fallDamageMultiplier},
  passiveFallDamage: ${passiveFallDamage},
  specialPower: ${specialPower},
  specialCooldown: ${specialCooldown},
  attackWindup: ${attackWindup},
  attackRange: ${attackRange},
  attackKnockback: ${attackKnockback},
  attackSpeed: ${attackSpeed},
  projectileSpeed: ${projectileSpeed},
  leapStrength: ${leapStrength},
  effectRadius: ${effectRadius},
  keys: {
    left: '${keys.left}',
    right: '${keys.right}',
    jump: '${keys.jump}',
    attack: '${keys.attack}',
    final: '${keys.final}',
    special: '${keys.special}'
  },

  attack(fighter, opponent) {
    if (fighter.stocks <= 0 || fighter.attackCooldown > 0 || fighter.stunned > 0) return;
    fighter.attackCooldown = Math.max(12, Math.round(${attackWindup} + 8));
    fighter.punchFrame = 0;
    fighter.punchAnimating = true;
    fighter.vx += fighter.facing * ${attackRange};
    if (opponent) opponent.vx += fighter.facing * ${attackKnockback};
    addCommentary(fighter.name + ' hits with a custom finisher!');
  },

  special(fighter, opponent) {
    if (fighter.specialCooldown > 0 || fighter.stunned > 0) return;
    fighter.vx += fighter.facing * ${specialPower};
    fighter.specialCooldown = ${specialCooldown};
    if (opponent) opponent.vx += fighter.facing * ${attackKnockback};
    addCommentary(fighter.name + ' unleashes a signature special!');
  }
});`;
      }

      function updateOutput() {
        document.getElementById('output').value = buildModText();
      }

      function copyCode() {
        const output = document.getElementById('output');
        output.select();
        navigator.clipboard.writeText(output.value).then(() => {
          const button = document.getElementById('copyBtn');
          const original = button.textContent;
          button.textContent = 'Copied!';
          setTimeout(() => { button.textContent = original; }, 1000);
        }).catch(() => {
          alert('Unable to copy automatically. Select the text manually.');
        });
      }

      function downloadFile() {
        const text = document.getElementById('output').value;
        const filename = `${(document.getElementById('key').value || 'custom-fighter').trim() || 'custom-fighter'}.js`;
        const blob = new Blob([text + '\n'], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      function randomizeForm() {
        const fighterNames = Object.keys(fighterPresets).filter((name) => name !== 'custom');
        const attackNames = Object.keys(attackPresets).filter((name) => name !== 'custom');
        const randomFighter = fighterNames[Math.floor(Math.random() * fighterNames.length)];
        const randomAttack = attackNames[Math.floor(Math.random() * attackNames.length)];
        const randomSpecial = Object.keys(specialPresets).filter((name) => name !== 'custom')[Math.floor(Math.random() * Object.keys(specialPresets).length)];
        const randomFS = Object.keys(fsPresets).filter((name) => name !== 'custom')[Math.floor(Math.random() * Object.keys(fsPresets).length)];

        document.getElementById('fighterPresetSelect').value = randomFighter;
        document.getElementById('attackPresetSelect').value = randomAttack;
        document.getElementById('specialPresetSelect').value = randomSpecial;
        document.getElementById('fsPresetSelect').value = randomFS;

        applyFighterPreset(randomFighter);
        applyAttackPreset(randomAttack);
        applySpecialPreset(randomSpecial);
        applyFSPreset(randomFS);
      }

      document.getElementById('generateBtn').addEventListener('click', updateOutput);
      document.getElementById('copyBtn').addEventListener('click', copyCode);
      document.getElementById('downloadBtn').addEventListener('click', downloadFile);
      document.getElementById('randomBtn').addEventListener('click', randomizeForm);
      document.getElementById('loadFighterPresetBtn').addEventListener('click', () => applyFighterPreset(document.getElementById('fighterPresetSelect').value));
      document.getElementById('loadAttackPresetBtn').addEventListener('click', () => applyAttackPreset(document.getElementById('attackPresetSelect').value));
      document.getElementById('loadSpecialPresetBtn').addEventListener('click', () => applySpecialPreset(document.getElementById('specialPresetSelect').value));
      document.getElementById('loadFSPresetBtn').addEventListener('click', () => applyFSPreset(document.getElementById('fsPresetSelect').value));

      document.querySelectorAll('input, select').forEach((element) => {
        element.addEventListener('input', updateOutput);
        element.addEventListener('change', updateOutput);
      });

      applyFighterPreset('custom');
      applyAttackPreset('custom');
      applySpecialPreset('custom');
      applyFSPreset('custom');
      updateOutput();
    </script>
  </body>
</html>
